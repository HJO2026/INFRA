# bench-infra 기본 스택: SUT(app, postgres) + 부하 생성기(k6, profile). 모니터링은 compose.monitoring.yml.
# 실행: docker compose --env-file versions.env -f compose/compose.base.yml [-f compose/compose.monitoring.yml] up -d
# 리소스 예산: docs/role-3.md (bench.config.yml 의 budget 과 동일해야 한다. check-resources.sh 가 대조)
name: bench

x-sut-cpuset: &sut-cpuset "0-3"
x-k6-cpuset: &k6-cpuset "4-5"

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: bench-postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bench}
      POSTGRES_DB: ${POSTGRES_DB:-bench}
      TZ: UTC
      PGTZ: UTC
    volumes:
      # postgres 18 이미지는 볼륨 루트가 /var/lib/postgresql (PGDATA=/var/lib/postgresql/18/docker)
      - pgdata:/var/lib/postgresql
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      # 호스트 포트는 변수. 이 호스트에서 5432 는 다른 프로젝트 컨테이너가 쓰고 있어 기본값을 15432 로 둔다
      - "127.0.0.1:${PG_HOST_PORT:-15432}:5432"
    cpuset: *sut-cpuset
    mem_limit: 1g
    memswap_limit: 1g
    shm_size: 256m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bench} -d ${POSTGRES_DB:-bench} -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [bench]

  app:
    image: ${APP_IMAGE}
    container_name: bench-app
    environment:
      # 앱 레포(../APP)의 환경변수 이름을 그대로 쓴다 (README 환경변수 표)
      DB_WRITE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bench}
      DB_USERNAME: ${POSTGRES_USER:-bench}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bench}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      VIRTUAL_THREADS_ENABLED: ${VIRTUAL_THREADS_ENABLED:-false}
      # HS256 공유 비밀키(32바이트 이상). 없으면 앱이 기동하지 않는다. 팀 값은 .env 로 덮어쓴다 (.env.example)
      JWT_SECRET: ${JWT_SECRET:-bench-local-insecure-secret-change-me}
      # JVM 옵션은 여기서만 주입한다 (Dockerfile 하드코딩 금지). 앱 이미지는 JAVA_OPTS 를 쓰고, 주면 이미지 기본값을 대체하므로
      # G1·GC 로그 옵션도 함께 넣는다. 코어 수는 SUT cpuset(0-3)과 맞춘다. 기본값 근거: docs/role-3.md
      JAVA_OPTS: ${JAVA_OPTS:--Xms1g -Xmx1g -XX:+UseG1GC -XX:ActiveProcessorCount=4 -Xlog:gc*:file=/logs/gc.log:time,uptime}
      TZ: UTC
    volumes:
      # 앱이 GC 로그를 쓰는 곳. 꺼내기: docker compose cp app:/logs/gc.log results/<run-id>/
      - gclogs:/logs
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:8080"
    cpuset: *sut-cpuset
    mem_limit: 1280m
    memswap_limit: 1280m
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 앱 이미지에 curl·wget 이 없다 (앱 README 의 계약표). bash 의 /dev/tcp 로 직접 HTTP 를 친다.
      # readiness 를 쓰려면 앱에서 management.endpoint.health.probes.enabled 가 켜져 있어야 한다 (.env.example)
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET ${APP_HEALTH_PATH:-/actuator/health} HTTP/1.0\r\n\r\n' >&3;
          grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    networks: [bench]

  # 부하 생성기. `up` 으로는 뜨지 않고 measure.sh 가 `compose --profile k6 run --rm k6 ...` 로 회차마다 실행한다
  k6:
    image: ${K6_IMAGE}
    profiles: [k6]
    environment:
      TZ: UTC
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: ${K6_PROMETHEUS_RW_TREND_STATS:-p(50),p(95),p(99),avg,max}
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "false"
      BASE_URL: http://app:8080
    volumes:
      - ../k6:/k6:ro
      - ../results:/results
    working_dir: /k6
    cpuset: *k6-cpuset
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      app:
        condition: service_healthy
    networks: [bench]

volumes:
  pgdata:
  gclogs:

networks:
  bench:
    name: bench
