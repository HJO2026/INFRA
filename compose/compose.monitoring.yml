  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: hjo-bench-cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,percpu,perf_event
    privileged: true            # cgroup 읽기에 필요. macOS Docker Desktop 에서는 일부 지표(디스크 IO)가 비거나 부정확할 수 있다
    volumes:
      # 여기 경로는 전부 "Docker 데몬이 도는 곳" 기준이다. Docker Desktop(맥·윈도우)이면 그 VM 안,
      # 리눅스면 호스트 자체다. 맥에서는 /var/run 같은 디렉터리가 VM 이 아니라 맥 쪽으로 매핑되므로
      # 디렉터리 대신 소켓 파일을 직접 마운트한다. 윈도우(WSL2 백엔드)도 같은 경로로 동작하는 것으로 본다.
      #
      # 아래 두 개가 없으면 cAdvisor 의 docker factory 등록이 실패하고 컨테이너별 지표 대신
      # 루트 cgroup 하나만 나온다. 플랫폼에 따라 경로가 다르면 .env 에서 바꾼다 (docs/open-questions.md).
      # 리눅스 호스트에서 지표가 비면 표준 구성(/:/rootfs:ro, /dev/disk/:/dev/disk:ro)을 추가한다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CADVISOR_CONTAINERD_SOCK:-/run/containerd/containerd.sock}:/run/containerd/containerd.sock:ro
      - ${CADVISOR_DOCKER_ROOT:-/var/lib/docker}:/var/lib/docker:ro
      - /sys:/sys:ro
    ports:
      - "127.0.0.1:${CADVISOR_HOST_PORT:-8081}:8080"
    cpuset: *mon-cpuset
    mem_limit: 256m
    memswap_limit: 256m
    networks: [bench]

  postgres_exporter:
    image: ${POSTGRES_EXPORTER_IMAGE}
    container_name: hjo-bench-postgres-exporter
    environment:
      TZ: UTC
      DATA_SOURCE_URI: postgres:5432/${BENCH_DB:-bench}?sslmode=disable
      DATA_SOURCE_USER: ${PGUSER:-hjo}
      DATA_SOURCE_PASS: ${PGPASSWORD:-hjo}
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    command:
      - --no-collector.stat_statements
      - --collector.database_wraparound
      - --collector.long_running_transactions
      - --collector.stat_activity_autovacuum
      - --collector.stat_checkpointer          # PG17+ 체크포인트 통계 (pg_stat_checkpointer)
      - --collector.stat_bgwriter
      - --collector.stat_database
      - --no-collector.stat_wal_receiver
      - --extend.query-path=/etc/postgres_exporter/queries.yaml   # WAL 생성량, 대기 종류별 백엔드, 락 대기 (deprecated 플래그지만 v0.20 에서 동작)
    volumes:
      - ../monitoring/postgres_exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "127.0.0.1:${PGEXPORTER_HOST_PORT:-9187}:9187"
    cpuset: *mon-cpuset
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [bench]

volumes:
  promdata:
#  grafanadata:
