# 모니터링 스택. 전부 cpuset 6 (docs/role-3.md 예산표). base 와 함께 -f 로 합쳐 쓴다.
name: bench

x-mon-cpuset: &mon-cpuset "6"

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: bench-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver     # k6 --out experimental-prometheus-rw
      - --web.enable-lifecycle                  # POST /-/reload 로 스크레이프 간격 전환
    environment:
      TZ: UTC
    volumes:
      # 스크레이프 간격 전환: PROM_CONFIG=prometheus.1s.yml make up (스파이크 분석용)
      - ../monitoring/prometheus/${PROM_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROM_HOST_PORT:-9090}:9090"
    cpuset: *mon-cpuset
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [bench]

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: bench-grafana
    environment:
      TZ: UTC
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # 익명 조회
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bench-overview.json
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    cpuset: *mon-cpuset
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q '\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [bench]

  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: bench-cadvisor
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,percpu,perf_event
    privileged: true            # cgroup 읽기에 필요. macOS Docker Desktop 에서는 일부 지표(디스크 IO)가 비거나 부정확할 수 있다
    volumes:
      # Docker Desktop(macOS) 주의: /var/run, / 같은 경로는 VM 이 아니라 Mac 의 디렉터리로 매핑된다.
      # /var/run/docker.sock 과 /var/lib/docker 만 VM 쪽으로 특별 처리되므로 디렉터리(/var/run) 대신 소켓 파일을 직접 마운트한다.
      # /rootfs, /dev/disk 마운트(리눅스 호스트용 표준 구성)는 여기서는 의미가 없어 뺐다. 리눅스 호스트면 추가해도 된다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro   # docker factory 가 cgroup 조회에 씀 (/run 은 VM 경로)
      - /var/lib/docker/:/var/lib/docker:ro                                  # 컨테이너 rw 레이어 식별에 필요
      - /sys:/sys:ro
    ports:
      - "127.0.0.1:${CADVISOR_HOST_PORT:-8081}:8080"
    cpuset: *mon-cpuset
    mem_limit: 256m
    memswap_limit: 256m
    networks: [bench]

  postgres_exporter:
    image: ${POSTGRES_EXPORTER_IMAGE}
    container_name: bench-postgres-exporter
    environment:
      TZ: UTC
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-bench}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-bench}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-bench}
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    command:
      - --no-collector.stat_statements
      - --collector.database_wraparound
      - --collector.long_running_transactions
      - --collector.stat_activity_autovacuum
      - --no-collector.stat_wal_receiver
    ports:
      - "127.0.0.1:${PGEXPORTER_HOST_PORT:-9187}:9187"
    cpuset: *mon-cpuset
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [bench]

volumes:
  promdata:
  grafanadata:
