# 모니터링 스택. 전부 cpuset 6 (docs/role-3.md 예산표). base 와 함께 -f 로 합쳐 쓴다.
name: hjo-bench

x-mon-cpuset: &mon-cpuset "6"

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: hjo-bench-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver     # k6 --out experimental-prometheus-rw
      - --web.enable-lifecycle                  # POST /-/reload 로 스크레이프 간격 전환
    environment:
      TZ: UTC
    volumes:
      # 스크레이프 간격 전환: PROM_CONFIG=prometheus.1s.yml docker compose up -d --wait (스파이크 분석용)
      - ../monitoring/prometheus/${PROM_CONFIG:-prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${PROM_HOST_PORT:-9090}:9090"
    cpuset: *mon-cpuset
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [bench]

  # --- Grafana (기본 꺼짐) ---------------------------------------------------
