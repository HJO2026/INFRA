spring:
  application:
    name: stub-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bench}
    username: ${SPRING_DATASOURCE_USERNAME:bench}
    password: ${SPRING_DATASOURCE_PASSWORD:bench}
    hikari:
      maximum-pool-size: 10   # study-spec 5장 baseline
  sql:
    init:
      mode: always            # 스텁 테이블 1개. 실제 구현은 마이그레이션(역할 1) 사용
      continue-on-error: false
  jackson:
    time-zone: UTC

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    root: WARN
    bench.stub: INFO
