# bench-infra baseline PostgreSQL 설정 (study-spec 5장). 컨테이너 mem_limit 1GB 기준.
# 이 파일은 config_file 로 통째로 쓰인다. 값을 바꾸면 초기값과 근거를 docs 에 같이 기록할 것.
# 스키마·확장은 여기서 다루지 않는다 (역할 1).

listen_addresses = '*'
port = 5432

# --- 메모리 (baseline) ---
shared_buffers = 256MB          # PG 메모리 1GB 의 25%
work_mem = 4MB                  # 기본값 명시. max_connections 30 × 4MB = 최대 120MB
maintenance_work_mem = 64MB     # pg_restore·VACUUM ANALYZE 용 (기본값)
effective_cache_size = 768MB    # 컨테이너 1GB 안에서 shared_buffers 를 뺀 정도. 플래너 힌트일 뿐 할당 아님

# --- 커넥션 (baseline) ---
max_connections = 30            # 기본 100 에서 낮춤. HikariCP 10 + 관리·exporter 여유
superuser_reserved_connections = 3

# --- 시간대·로케일 ---
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# --- WAL·체크포인트 (기본값 명시. 튜닝은 각자 ADR) ---
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# --- 로깅 ---
log_destination = 'stderr'
logging_collector = off         # stdout 으로 내보내 docker logs 로 본다
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = -1 # 느린 쿼리 로그 끔 (부하 중 IO 간섭 방지). 분석 시 임시로 켠다
log_checkpoints = on
log_lock_waits = on             # deadlock_timeout(1s) 넘게 기다린 락 기록. 대시보드 "락 대기" 보조 자료
log_line_prefix = '%m [%p] %q%u@%d '
log_autovacuum_min_duration = 1s

# --- 통계 (exporter 가 읽음) ---
track_activities = on
track_counts = on
track_io_timing = on            # pg_stat_database blk_read_time 등. 오버헤드 작음
track_wal_io_timing = on

# --- 확장 (baseline 은 없음. 필요하면 각자 override 에서 주입) ---
# shared_preload_libraries = 'pg_stat_statements'
